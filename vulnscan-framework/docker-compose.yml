# Reproducible local deployment of the vulnscan framework (proposal S7.2).
#
#   docker compose build          # builds the shared tools image + services
#   docker compose up             # starts db, redis, api, worker, microservices
#
# The Django API is the thin gateway; the Celery worker and the two FastAPI
# microservices perform the actual detection and validation.
services:
  db:
    image: postgres:16
    environment:
      POSTGRES_DB: vulnscan
      POSTGRES_USER: vulnscan
      POSTGRES_PASSWORD: vulnscan
    volumes:
      - pgdata:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U vulnscan"]
      interval: 5s
      timeout: 5s
      retries: 5

  redis:
    image: redis:7
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 5

  # Shared base image with all analysis tools; built once, reused by worker +
  # microservices. This service just builds the image and exits.
  tools:
    image: vulnscan-tools:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.tools
    command: ["true"]

  web:
    build:
      context: .
      dockerfile: docker/Dockerfile.web
    depends_on: [db, redis]
    environment: &env
      POSTGRES_HOST: db
      POSTGRES_DB: vulnscan
      POSTGRES_USER: vulnscan
      POSTGRES_PASSWORD: vulnscan
      REDIS_URL: redis://redis:6379/0
      DJANGO_DEBUG: "1"
      STATIC_ANALYSIS_MODE: http
      STATIC_ANALYSIS_URL: http://static-analysis:8100
    ports: ["8000:8000"]

  worker:
    image: vulnscan-tools:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.worker
    depends_on: [db, redis, tools]
    working_dir: /app/services/orchestration
    command: ["celery", "-A", "config", "worker", "--loglevel=info", "--concurrency=2"]
    environment: *env

  static-analysis:
    image: vulnscan-tools:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.static
    depends_on: [tools]
    command: ["uvicorn", "services.static_analysis_service.app:app", "--host", "0.0.0.0", "--port", "8100"]
    ports: ["8100:8100"]

  testnet:
    image: vulnscan-tools:latest
    build:
      context: .
      dockerfile: docker/Dockerfile.testnet
    depends_on: [tools]
    command: ["uvicorn", "services.testnet_service.app:app", "--host", "0.0.0.0", "--port", "8200"]
    ports: ["8200:8200"]

volumes:
  pgdata:
